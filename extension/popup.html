<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Frame</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/48.png" alt=""><strong>frame<span>.</span></strong><span class="local">ALL LOCAL ◈</span></header><h1>A little of you.<br>On Discord<span>.</span></h1><div id="status" role="status">Connecting to Frame…</div><form id="pair-form" hidden><label for="code">PAIRING CODE FROM THE FRAME APP</label><div class="input-row"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="off" required aria-label="Six-digit pairing code"><button id="pair-button" type="submit">Pair ↗</button></div><p>Open Frame → Add to Chrome → Get pairing code.</p></form><div id="ready" hidden><div class="ready-mark">✓</div><p>Open a YouTube video.<br><span>Frame takes it from there.</span></p><button id="re-pair" class="subtle">Pair again</button></div><p id="error" role="alert" hidden></p><button id="retry" class="subtle" hidden>Try connecting again ↗</button><footer>No watch history. No account tokens.<br>Private windows are never shared.</footer><script src="popup.js"></script></body></html>
